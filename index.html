<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Szuflad MB</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #121212; color: #ffffff; max-width: 500px; margin: auto; }
        
        .btn-toggle-main { 
            display: block; 
            margin: 10px auto 10px auto; 
            padding: 10px 20px; 
            background: transparent; 
            color: #4dabf7; 
            border: 2px solid #4dabf7; 
            border-radius: 12px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-toggle-main:active { transform: scale(0.98); background: rgba(77, 171, 247, 0.1); }

        .controls-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-prowadnica, .btn-wysokosc { 
            flex: 1;
            padding: 8px 12px; 
            background: #2a2a2a; 
            border-radius: 20px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s;
            text-align: center;
        }
        .btn-prowadnica { color: #ffd43b; border: 1px solid #ffd43b; }
        .btn-wysokosc { color: #ff922b; border: 1px solid #ff922b; }
        
        .btn-prowadnica:active, .btn-wysokosc:active { background: #333; transform: scale(0.98); }

        .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .card-header { font-size: 16px; font-weight: bold; color: #4dabf7; margin-bottom: 12px; }

        .szafka-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .szafka-row input { margin-bottom: 0; }
        .input-szer { flex: 2; }
        .input-szt { flex: 1; }

        label { font-size: 13px; color: #aaa; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; color: #fff; font-weight: bold; text-align: center; }
        input::placeholder { color: #666; font-weight: normal; }
        input:focus { border-color: #4dabf7; outline: none; }

        .btn-del { background: #ff4d4d; color: white; border: none; width: 42px; height: 46px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; flex-shrink: 0; }
        .btn-add { display: block; width: 100%; padding: 12px; background: #2a2a2a; color: #4dabf7; border: 1px dashed #4dabf7; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-calc { display: block; width: 100%; padding: 16px; background: #2b8a3e; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(43, 138, 62, 0.4); }
        .btn-calc:active { background: #237032; }

        .formatka-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a2a2a; font-size: 18px; font-family: monospace; }
        .formatka-item:last-child { border-bottom: none; }
        .formatka-lp { width: 36px; color: #888; font-weight: bold; }
        .formatka-dim { flex: 1; color: #4dabf7; font-weight: bold; }
        .formatka-qty { background: #ff6b6b; color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 15px; font-family: sans-serif; }
        
        #wyniki { display: none; }
    </style>
</head>
<body>

    <button id="btn-typ" class="btn-toggle-main" onclick="przelaczTypZestawu()">MB 2 + 1</button>

    <div class="controls-row">
        <button id="btn-prowadnica" class="btn-prowadnica" onclick="przelaczProwadnice()">Prowadnica: 500 mm</button>
        <button id="btn-wysokosc" class="btn-wysokosc" onclick="przelaczWysokosc()" style="display: none;">Wysokość: Niska (69 mm)</button>
    </div>

    <!-- Wprowadzanie szafek -->
    <div class="card">
        <div class="card-header">Lista szafek</div>
        <div id="lista-szafek"></div>
        <button class="btn-add" onclick="dodajWierszSzafki()">+ Dodaj kolejną szafkę</button>
    </div>

    <button class="btn-calc" onclick="generujWymiary()">OBLICZ FORMATKI</button>

    <!-- Wyniki -->
    <div id="wyniki">
        <div class="card">
            <div class="card-header" style="color: #69db7c;">Lista formatek do cięcia</div>
            <div id="kontener-formatek"></div>
        </div>
    </div>

    <script>
        let wierszId = 0;
        
        // Prowadnice
        const opcjeProwadnic = [500, 450, 400, 350, 300];
        let indeksProwadnicy = 0;

        // Typ zestawu: true = MB 2+1, false = MB pojedyncza szuflada
        let trybKombi = true;

        // Wysokości dla pojedynczej szuflady
        const opcjeWysokosci = [
            { nazwa: 'Niska', h: 69 },
            { nazwa: 'Średnia', h: 120 },
            { nazwa: 'Wysoka', h: 180 }
        ];
        let indeksWysokosci = 0;

        function przelaczTypZestawu() {
            trybKombi = !trybKombi;
            const btnTyp = document.getElementById('btn-typ');
            const btnWysokosc = document.getElementById('btn-wysokosc');

            if (trybKombi) {
                btnTyp.innerText = "MB 2 + 1";
                btnWysokosc.style.display = "none";
            } else {
                btnTyp.innerText = "MB pojedyncza szuflada";
                btnWysokosc.style.display = "block";
            }

            odswiezWyniki();
        }

        function przelaczProwadnice() {
            indeksProwadnicy = (indeksProwadnicy + 1) % opcjeProwadnic.length;
            const aktualnaProwadnica = opcjeProwadnic[indeksProwadnicy];
            document.getElementById('btn-prowadnica').innerText = `Prowadnica: ${aktualnaProwadnica} mm`;

            odswiezWyniki();
        }

        function przelaczWysokosc() {
            indeksWysokosci = (indeksWysokosci + 1) % opcjeWysokosci.length;
            const opt = opcjeWysokosci[indeksWysokosci];
            document.getElementById('btn-wysokosc').innerText = `Wysokość: ${opt.nazwa} (${opt.h} mm)`;

            odswiezWyniki();
        }

        function odswiezWyniki() {
            if (document.getElementById('wyniki').style.display === 'block') {
                generujWymiary();
            }
        }

        function dodajWierszSzafki(szer = '', szt = 1) {
            wierszId++;
            const container = document.getElementById('lista-szafek');
            const div = document.createElement('div');
            div.className = 'szafka-row';
            div.id = `row-${wierszId}`;
            div.innerHTML = `
                <div class="input-szer">
                    <label>Szerokość (mm)</label>
                    <input type="number" class="val-szer" value="${szer}" placeholder="mm" autocomplete="off" onfocus="this.select()">
                </div>
                <div class="input-szt">
                    <label>Liczba (szt.)</label>
                    <input type="number" class="val-szt" value="${szt}" placeholder="szt." autocomplete="off" onfocus="this.select()">
                </div>
                ${wierszId > 1 ? `<button class="btn-del" onclick="usunWiersz(${wierszId})">×</button>` : '<div style="width:42px;"></div>'}
            `;
            container.appendChild(div);
        }

        function usunWiersz(id) {
            const el = document.getElementById(`row-${id}`);
            if (el) el.remove();
        }

        function generujWymiary() {
            const wiersze = document.querySelectorAll('.szafka-row');
            let mapaFormatek = {};

            const dlugoscProwadnicy = opcjeProwadnic[indeksProwadnicy];
            const dlugoscDna = dlugoscProwadnicy - 5;

            wiersze.forEach(row => {
                const S = parseFloat(row.querySelector('.val-szer').value) || 0;
                const n = parseInt(row.querySelector('.val-szt').value) || 0;

                if (S > 0 && n > 0) {
                    let dno_szer = S - 122;
                    let tyl_dl = S - 132;
                    let wymiary = [];

                    if (trybKombi) {
                        // Zestaw MB 2 + 1
                        wymiary = [
                            { dim: `${dlugoscDna} × ${dno_szer}`, qty: 3 * n },
                            { dim: `${tyl_dl} × 69`, qty: 1 * n },
                            { dim: `${tyl_dl} × 180`, qty: 2 * n }
                        ];
                    } else {
                        // MB pojedyncza szuflada
                        const hTyl = opcjeWysokosci[indeksWysokosci].h;
                        wymiary = [
                            { dim: `${dlugoscDna} × ${dno_szer}`, qty: 1 * n },
                            { dim: `${tyl_dl} × ${hTyl}`, qty: 1 * n }
                        ];
                    }

                    wymiary.forEach(item => {
                        mapaFormatek[item.dim] = (mapaFormatek[item.dim] || 0) + item.qty;
                    });
                }
            });

            const kontener = document.getElementById('kontener-formatek');
            kontener.innerHTML = '';

            let html = '';
            let lp = 1;

            for (let dim in mapaFormatek) {
                html += `
                    <div class="formatka-item">
                        <span class="formatka-lp">${lp}.</span>
                        <span class="formatka-dim">${dim} mm</span>
                        <span class="formatka-qty">${mapaFormatek[dim]} szt.</span>
                    </div>`;
                lp++;
            }

            if (html === '') {
                html = '<div style="color:#aaa; text-align:center;">Brak danych do obliczeń.</div>';
            }

            kontener.innerHTML = html;
            document.getElementById('wyniki').style.display = 'block';
        }

        // Pierwszy wiersz startowy
        dodajWierszSzafki('', 1);
    </script>
</body>
</html>
