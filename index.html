<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB 2 + 1 - Kalkulator Szuflad</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #121212; color: #ffffff; max-width: 500px; margin: auto; }
        
        .header-title { text-align: center; color: #4dabf7; margin-top: 10px; margin-bottom: 4px; font-size: 26px; font-weight: bold; }
        .header-subtitle { text-align: center; color: #888888; margin-bottom: 20px; font-size: 16px; font-weight: normal; }

        .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; position: relative; }
        .card-summary { background: #182533; border-color: #2b4257; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-weight: bold; font-size: 16px; color: #4dabf7; }
        .btn-remove { background: #ff4d4d; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }

        label { font-size: 14px; color: #aaa; display: block; margin-bottom: 6px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-field { flex: 1; }
        
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; color: #fff; font-weight: bold; text-align: center; }
        input:focus { border-color: #4dabf7; outline: none; }
        
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2a2a; }
        .row:last-child { border-bottom: none; }
        .item-title { font-weight: bold; font-size: 15px; color: #fff; }
        .item-dims { font-size: 16px; color: #4dabf7; font-weight: bold; font-family: monospace; }
        .item-qty { background: #ff6b6b; color: white; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        
        .btn-add { display: block; width: 100%; padding: 14px; background: #2b8a3e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; text-align: center; }
        .btn-add:active { background: #237032; }
    </style>
</head>
<body>

    <div class="header-title">MB 2 + 1</div>
    <div class="header-subtitle">prowadnica 50</div>

    <!-- Pojemnik na szafki -->
    <div id="szafki-list"></div>

    <button class="btn-add" onclick="dodajSzafke()">+ Dodaj kolejną szafkę</button>

    <!-- Podsumowanie łącznej ilości formatek -->
    <div class="card card-summary">
        <div class="card-title" style="color: #69db7c; margin-bottom: 12px;">Podsumowanie łączne</div>
        <div class="row">
            <div class="item-title">Suma dni szuflad</div>
            <span class="item-qty" style="background: #2f9e44;" id="total_dno">0 szt.</span>
        </div>
        <div class="row">
            <div class="item-title">Suma tyłów niskich</div>
            <span class="item-qty" style="background: #2f9e44;" id="total_niskie">0 szt.</span>
        </div>
        <div class="row">
            <div class="item-title">Suma tyłów wysokich</div>
            <span class="item-qty" style="background: #2f9e44;" id="total_wysokie">0 szt.</span>
        </div>
    </div>

    <script>
        let szafkaId = 0;

        function dodajSzafke(szerokosc = 600, ilosc = 1) {
            szafkaId++;
            const id = szafkaId;
            const container = document.getElementById('szafki-list');

            const card = document.createElement('div');
            card.className = 'card';
            card.id = `szafka-${id}`;
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">Szafka #${id}</div>
                    ${id > 1 ? `<button class="btn-remove" onclick="usunSzafke(${id})">Usuń</button>` : ''}
                </div>
                <div class="input-group">
                    <div class="input-field">
                        <label>Szerokość (mm):</label>
                        <input type="number" id="szer-${id}" value="${szerokosc}" oninput="obliczWszystko()">
                    </div>
                    <div class="input-field">
                        <label>Liczba (szt.):</label>
                        <input type="number" id="ilosc-${id}" value="${ilosc}" oninput="obliczWszystko()">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <div class="item-title">Dno szuflady</div>
                        <div class="item-dims" id="dno-${id}">-</div>
                    </div>
                    <span class="item-qty" id="s_dno-${id}">0 szt.</span>
                </div>
                <div class="row">
                    <div>
                        <div class="item-title">Tył szuflady niski</div>
                        <div class="item-dims" id="tyl_niski-${id}">-</div>
                    </div>
                    <span class="item-qty" id="s_niski-${id}">0 szt.</span>
                </div>
                <div class="row">
                    <div>
                        <div class="item-title">Tył szuflady wysoki</div>
                        <div class="item-dims" id="tyl_wysoki-${id}">-</div>
                    </div>
                    <span class="item-qty" id="s_wysoki-${id}">0 szt.</span>
                </div>
            `;
            container.appendChild(card);
            obliczWszystko();
        }

        function usunSzafke(id) {
            const card = document.getElementById(`szafka-${id}`);
            if (card) {
                card.remove();
                obliczWszystko();
            }
        }

        function obliczWszystko() {
            let totalDno = 0;
            let totalNiski = 0;
            let totalWysoki = 0;

            const cards = document.querySelectorAll('#szafki-list .card');
            
            cards.forEach(card => {
                const id = card.id.replace('szafka-', '');
                const S = parseFloat(document.getElementById(`szer-${id}`).value) || 0;
                const n = parseInt(document.getElementById(`ilosc-${id}`).value) || 0;

                if (S > 0 && n > 0) {
                    let dno_szer = S - 122;
                    let tyl_dl = S - 132;

                    let dnoSzt = 3 * n;
                    let niskiSzt = 1 * n;
                    let wysokiSzt = 2 * n;

                    document.getElementById(`dno-${id}`).innerText = "495 × " + dno_szer + " mm";
                    document.getElementById(`tyl_niski-${id}`).innerText = tyl_dl + " × 69 mm";
                    document.getElementById(`tyl_wysoki-${id}`).innerText = tyl_dl + " × 180 mm";

                    document.getElementById(`s_dno-${id}`).innerText = dnoSzt + " szt.";
                    document.getElementById(`s_niski-${id}`).innerText = niskiSzt + " szt.";
                    document.getElementById(`s_wysoki-${id}`).innerText = wysokiSzt + " szt.";

                    totalDno += dnoSzt;
                    totalNiski += niskiSzt;
                    totalWysoki += wysokiSzt;
                } else {
                    document.getElementById(`dno-${id}`).innerText = "-";
                    document.getElementById(`tyl_niski-${id}`).innerText = "-";
                    document.getElementById(`tyl_wysoki-${id}`).innerText = "-";
                    document.getElementById(`s_dno-${id}`).innerText = "0 szt.";
                    document.getElementById(`s_niski-${id}`).innerText = "0 szt.";
                    document.getElementById(`s_wysoki-${id}`).innerText = "0 szt.";
                }
            });

            document.getElementById('total_dno').innerText = totalDno + " szt.";
            document.getElementById('total_niskie').innerText = totalNiski + " szt.";
            document.getElementById('total_wysokie').innerText = totalWysoki + " szt.";
        }

        // Dodaj pierwszą szafkę na start
        dodajSzafke(600, 1);
    </script>
</body>
</html>
