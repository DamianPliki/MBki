<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB 2 + 1 - Kalkulator Szuflad</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #121212; color: #ffffff; max-width: 500px; margin: auto; }
        
        /* Nagłówek i podtytuł */
        .header-title { text-align: center; color: #4dabf7; margin-top: 10px; margin-bottom: 4px; font-size: 26px; font-weight: bold; }
        .header-subtitle { text-align: center; color: #888888; margin-bottom: 20px; font-size: 16px; font-weight: normal; }

        .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        label { font-size: 14px; color: #aaa; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 14px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; color: #fff; font-weight: bold; text-align: center; margin-bottom: 12px; }
        input:focus { border-color: #4dabf7; outline: none; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
        .row:last-child { border-bottom: none; }
        .item-title { font-weight: bold; font-size: 15px; color: #fff; }
        .item-dims { font-size: 16px; color: #4dabf7; font-weight: bold; font-family: monospace; }
        .item-qty { background: #ff6b6b; color: white; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header-title">MB 2 + 1</div>
    <div class="header-subtitle">prowadnica 50</div>

    <div class="card">
        <label>Szerokość szafki (mm):</label>
        <input type="number" id="szerokosc" value="600" oninput="oblicz()">

        <label>Liczba szafek (szt.):</label>
        <input type="number" id="ilosc" value="1" oninput="oblicz()">
    </div>

    <div class="card">
        <div class="row">
            <div>
                <div class="item-title">Dno szuflady</div>
                <div class="item-dims" id="dno">-</div>
            </div>
            <span class="item-qty" id="s_dno">0 szt.</span>
        </div>

        <div class="row">
            <div>
                <div class="item-title">Tył szuflady niski</div>
                <div class="item-dims" id="tyl_niski">-</div>
            </div>
            <span class="item-qty" id="s_niski">0 szt.</span>
        </div>

        <div class="row">
            <div>
                <div class="item-title">Tył szuflady wysoki</div>
                <div class="item-dims" id="tyl_wysoki">-</div>
            </div>
            <span class="item-qty" id="s_wysoki">0 szt.</span>
        </div>
    </div>

    <script>
        function oblicz() {
            let S = parseFloat(document.getElementById('szerokosc').value) || 0;
            let n = parseInt(document.getElementById('ilosc').value) || 0;

            if (S > 0 && n > 0) {
                // Wzory:
                let dno_szer = S - 122;
                let tyl_dl = S - 132;

                document.getElementById('dno').innerText = "495 × " + dno_szer + " mm";
                document.getElementById('tyl_niski').innerText = tyl_dl + " × 69 mm";
                document.getElementById('tyl_wysoki').innerText = tyl_dl + " × 180 mm";

                document.getElementById('s_dno').innerText = (3 * n) + " szt.";
                document.getElementById('s_niski').innerText = (1 * n) + " szt.";
                document.getElementById('s_wysoki').innerText = (2 * n) + " szt.";
            } else {
                document.getElementById('dno').innerText = "-";
                document.getElementById('tyl_niski').innerText = "-";
                document.getElementById('tyl_wysoki').innerText = "-";
                document.getElementById('s_dno').innerText = "0 szt.";
                document.getElementById('s_niski').innerText = "0 szt.";
                document.getElementById('s_wysoki').innerText = "0 szt.";
            }
        }
        oblicz();
    </script>
</body>
</html>
