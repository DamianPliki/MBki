<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB 2 + 1 - Kalkulator Szuflad</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #121212; color: #ffffff; max-width: 500px; margin: auto; }
        
        .header-title { text-align: center; color: #4dabf7; margin-top: 10px; margin-bottom: 4px; font-size: 26px; font-weight: bold; }
        .header-subtitle { text-align: center; color: #888888; margin-bottom: 20px; font-size: 16px; font-weight: normal; }

        .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .card-header { font-size: 16px; font-weight: bold; color: #4dabf7; margin-bottom: 12px; }

        .szafka-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .szafka-row input { margin-bottom: 0; }
        .input-szer { flex: 2; }
        .input-szt { flex: 1; }

        label { font-size: 13px; color: #aaa; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; color: #fff; font-weight: bold; text-align: center; }
        input:focus { border-color: #4dabf7; outline: none; }

        .btn-del { background: #ff4d4d; color: white; border: none; width: 42px; height: 46px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; flex-shrink: 0; }
        .btn-add { display: block; width: 100%; padding: 12px; background: #2a2a2a; color: #4dabf7; border: 1px dashed #4dabf7; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-calc { display: block; width: 100%; padding: 16px; background: #2b8a3e; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(43, 138, 62, 0.4); }
        .btn-calc:active { background: #237032; }

        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2a2a; }
        .row:last-child { border-bottom: none; }
        .item-title { font-weight: bold; font-size: 15px; color: #fff; }
        .item-dims { font-size: 16px; color: #4dabf7; font-weight: bold; font-family: monospace; }
        .item-qty { background: #ff6b6b; color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        
        #wyniki { display: none; }
    </style>
</head>
<body>

    <div class="header-title">MB 2 + 1</div>
    <div class="header-subtitle">prowadnica 50</div>

    <!-- Wprowadzanie szafek -->
    <div class="card">
        <div class="card-header">Lista szafek</div>
        <div id="lista-szafek"></div>
        <button class="btn-add" onclick="dodajWierszSzafki()">+ Dodaj kolejną szafkę</button>
    </div>

    <button class="btn-calc" onclick="generujWymiary()">OBLICZ FORMATKI</button>

    <!-- Wyniki -->
    <div id="wyniki">
        <div class="card">
            <div class="card-header" style="color: #69db7c;">Podsumowanie formatek</div>
            <div id="kontener-formatek"></div>
        </div>
    </div>

    <script>
        let wierszId = 0;

        function dodajWierszSzafki(szer = 600, szt = 1) {
            wierszId++;
            const container = document.getElementById('lista-szafek');
            const div = document.createElement('div');
            div.className = 'szafka-row';
            div.id = `row-${wierszId}`;
            div.innerHTML = `
                <div class="input-szer">
                    <label>Szerokość (mm)</label>
                    <input type="number" class="val-szer" value="${szer}">
                </div>
                <div class="input-szt">
                    <label>Liczba (szt.)</label>
                    <input type="number" class="val-szt" value="${szt}">
                </div>
                ${wierszId > 1 ? `<button class="btn-del" onclick="usunWiersz(${wierszId})">×</button>` : '<div style="width:42px;"></div>'}
            `;
            container.appendChild(div);
        }

        function usunWiersz(id) {
            const el = document.getElementById(`row-${id}`);
            if (el) el.remove();
        }

        function generujWymiary() {
            const wiersze = document.querySelectorAll('.szafka-row');
            let dnoMapa = {};
            let tylNiskiMapa = {};
            let tylWysokiMapa = {};

            wiersze.forEach(row => {
                const S = parseFloat(row.querySelector('.val-szer').value) || 0;
                const n = parseInt(row.querySelector('.val-szt').value) || 0;

                if (S > 0 && n > 0) {
                    let dno_szer = S - 122;
                    let tyl_dl = S - 132;

                    let dnoWymiar = `495 × ${dno_szer} mm`;
                    let niskiWymiar = `${tyl_dl} × 69 mm`;
                    let wysokiWymiar = `${tyl_dl} × 180 mm`;

                    dnoMapa[dnoWymiar] = (dnoMapa[dnoWymiar] || 0) + (3 * n);
                    tylNiskiMapa[niskiWymiar] = (tylNiskiMapa[niskiWymiar] || 0) + (1 * n);
                    tylWysokiMapa[wysokiWymiar] = (tylWysokiMapa[wysokiWymiar] || 0) + (2 * n);
                }
            });

            const kontener = document.getElementById('kontener-formatek');
            kontener.innerHTML = '';

            // Generowanie HTML wyników
            let html = '';

            html += `<div style="font-weight:bold; color:#aaa; margin-top:10px; margin-bottom:6px; font-size:13px;">Dna szuflad:</div>`;
            for (let dim in dnoMapa) {
                html += `
                    <div class="row">
                        <div>
                            <div class="item-title">Dno szuflady</div>
                            <div class="item-dims">${dim}</div>
                        </div>
                        <span class="item-qty">${dnoMapa[dim]} szt.</span>
                    </div>`;
            }

            html += `<div style="font-weight:bold; color:#aaa; margin-top:16px; margin-bottom:6px; font-size:13px;">Tyły niskie:</div>`;
            for (let dim in tylNiskiMapa) {
                html += `
                    <div class="row">
                        <div>
                            <div class="item-title">Tył niski</div>
                            <div class="item-dims">${dim}</div>
                        </div>
                        <span class="item-qty">${tylNiskiMapa[dim]} szt.</span>
                    </div>`;
            }

            html += `<div style="font-weight:bold; color:#aaa; margin-top:16px; margin-bottom:6px; font-size:13px;">Tyły wysokie:</div>`;
            for (let dim in tylWysokiMapa) {
                html += `
                    <div class="row">
                        <div>
                            <div class="item-title">Tył wysoki</div>
                            <div class="item-dims">${dim}</div>
                        </div>
                        <span class="item-qty">${tylWysokiMapa[dim]} szt.</span>
                    </div>`;
            }

            kontener.innerHTML = html;
            document.getElementById('wyniki').style.display = 'block';
        }

        // Pierwsza szafka na start
        dodajWierszSzafki(600, 1);
    </script>
</body>
</html>
